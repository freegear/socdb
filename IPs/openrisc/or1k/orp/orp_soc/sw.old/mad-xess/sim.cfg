section memory
  memory_table_file = "simmem.cfg"
  /*random_seed = 12345
  type = random*/
  pattern = 0x00
  type = unknown /* Fastest */
end

section cpu
  ver = 0x1200
  rev = 0x0001
  /* upr = */
  superscalar = 0
  hazards = 0
  history = 0
  dependstats = 0
  dependency = 0
  slp = 0
  btic_sim = 0
  bpb = 0
end

section debug
  /*enabled = 0
  gdb_enabled = 0*/
  server_port = 9999
end

section sim
  debug = 0
  verbose = 0
  profile = 0
  prof_fn = "sim.profile"
  
  /* iprompt = 0 */
  exe_log = 1
  exe_log_fn = "executed.log"
end

section mc
  enabled = 0
  baseaddr = 0xa0000000
  POC = 0x00000008                 /* Power on configuration register */
end

section uart
  enabled = 0
  nuarts = 1
  
  device 0
    baseaddr = 0x80000000
    rxfile = "/tmp/uart0.rx"
    txfile = "/tmp/uart0.tx"
    jitter = -1                     /* async behaviour */
  enddevice
end

section dma
  enabled = 0
  ndmas = 1
  
  device 0
    baseaddr = 0x90000000
    irq = 4
  enddevice
end

section VAPI
  enabled = 0
end
