/* INTRODUCTION

   The or1ksim have various parameters, which can be set in configuration
   files.  Multiple configurations may be used and switched between at
   or1ksim startup.
   By default, or1ksim loads condfiguration file from './sim.cfg' and if not
   found it checks '~/.or1k/sim.cfg'. If even this file is not found or
   all parameters are not defined, default configuration is used.
   Users should not rely on default configuration, but rather redefine all
   critical settings, since default configuration may differ in newer
   versions of the or1ksim.
   If multiple configurations are used, user can switch between them by
   supplying -f <filename.cfg> option when starting simulator.

   This file may contain (standard C) only comments - no // support.

   Like normal configuration file, this file is divided in sections,
   where each section is described in detail also.

   Some section also have subsections. One example of such subsection is
   block:

   device <index>
     instance specific parameters...
   enddevice

   which creates a device instance.
*/


/* MEMORY SECTION

   This section specifies how is initial memory generated and which blocks
   it consist of.

   type = random/unknown/pattern
      specifies the initial memory values. 'random' parameter generate
      random memory using seed 'random_seed' parameter. 'pattern' parameter
      fills memory with 'pattern' parameter and 'unknown' does not specify
      how memory should be generated - the fastest option.

   random_seed = <value>
      random seed for randomizer, used if type = random

   pattern = <value>
      pattern to fill memory, used if type = pattern

   nmemories = <value>
      number of memory instances connected

   instance specific:
     baseaddr = <hex_value>
        memory start address

     size = <hex_value>
        memory size

     name = "<string>"
        memory block name

     ce = <value>
        chip enable index of the memory instance

     delayr = <value>
        cycles, required for read access, -1 if instance does not support reading

     delayw = <value>
        cycles, required for write access, -1 if instance does not support writing

     16550 = 0/1
        0, if this device is uart 16450 and 1, if it is 16550

     log = "<filename>"
        filename, where to log memory accesses to, no log, if log command is not specified
*/

section memory
  /*random_seed = 12345
  type = random*/
  pattern = 0x00
  type = unknown /* Fastest */

  nmemories = 3
  device 0
    name = "FLASH"
    ce = 0
    baseaddr = 0xf0000000
    size = 0x00800000
    delayr = 10
    delayw = -1
/*    log = "flash.log"*/
  enddevice

  device 1
    name = "RAM"
    ce = 1
    baseaddr = 0x00000000
    size = 0x01000000
    delayr = 1
    delayw = 2
/*    log = "ram.log"*/
  enddevice
  device 2
    name = "SRAM"
    ce = 2
    baseaddr = 0x08000000
    size = 0x00400000
    delayr = 1
    delayw = 2
/*    log = "ram.log"*/
  enddevice
end

/* IMMU SECTION

    This section configures Instruction Memory Menangement Unit

    enabled = 0/1
       whether IMMU is enabled
       (NOTE: UPR bit is set)

    nsets = <value>
       number of ITLB sets; must be power of two

    nways = <value>
       number of ITLB ways

    pagesize = <value>
       instruction page size; must be power of two

    entrysize = <value>
       instruction entry size in bytes

    ustates = <value>
       number of ITLB usage states (2, 3, 4 etc., max is 4)
*/

section immu
  enabled = 1
  nsets = 64
  nways = 1
  pagesize = 8192
end

/* DMMU SECTION

    This section configures Data Memory Menangement Unit

    enabled = 0/1
       whether DMMU is enabled
       (NOTE: UPR bit is set)

    nsets = <value>
       number of DTLB sets; must be power of two

    nways = <value>
       number of DTLB ways

    pagesize = <value>
       data page size; must be power of two

    entrysize = <value>
       data entry size in bytes

    ustates = <value>
       number of DTLB usage states (2, 3, 4 etc., max is 4)
*/

section dmmu
  enabled = 1
  nsets = 64
  nways = 1
  pagesize = 8192
end


/* IC SECTION

    This section configures Instruction Cache

    enabled = 0/1
       whether IC is enabled
       (NOTE: UPR bit is set)

    nsets = <value>
       number of IC sets; must be power of two

    nways = <value>
       number of IC ways

    blocksize = <value>
       IC block size in bytes; must be power of two

    ustates = <value>
       number of IC usage states (2, 3, 4 etc., max is 4)
*/

section ic
  enabled = 1
  nsets = 256
  nways = 1
  blocksize = 16
end

/* DC SECTION

    This section configures Data Cache

    enabled = 0/1
       whether DC is enabled
       (NOTE: UPR bit is set)

    nsets = <value>
       number of DC sets; must be power of two

    nways = <value>
       number of DC ways

    blocksize = <value>
       DC block size in bytes; must be power of two

    ustates = <value>
       number of DC usage states (2, 3, 4 etc., max is 4)
*/

section dc
  enabled = 1
  nsets = 256
  nways = 1
  blocksize = 16
end

/* SIM SECTION

  This section specifies how should sim behave.

  verbose = 0/1
      whether to print out extra messages

  debug = 0-9
      = 0 disabled debug messages
      1-9 level of sim debug information, greater the number more verbose is
          the output

  profile = 0/1
      whether to generate profiling file 'sim.profile'

  prof_fn = "<filename>"
      filename, where to generate profiling info, used
      only if 'profile' is set

  history = 0/1
      whether instruction execution flow is tracked for
      display by simulator hist command. Useful for
      back-trace debugging.

  iprompt = 0/1
      whether we strart in interactive prompt

  exe_log = 0/1
      whether execution log should be generated

  exe_log_fn = "<filename>"
      where to put execution log in, used only if 'exe_log'
      is set
      
  clkcycle = <value>[ps|ns|us|ms]
      specifies time measurement for one cycle
*/

section sim
  verbose = 0
  debug = 0
  profile = 0
  prof_fn = "sim.profile"

  history = 0
  /* iprompt = 0 */
  exe_log = 0
  exe_log_type = software
  exe_log_start = 3800000
/*  exe_log_end = 20000000*/
  exe_log_marker = 1000
  exe_log_fn = "executed.log"
end


/* SECTION VAPI

    This section configures Verification API, used for Advanced
    Core Verification.

    enabled = 0/1
        whether to start VAPI server

    server_port = <value>
        TCP/IP port to start VAPI server on

    log_enabled = 0/1
       whether logging of VAPI requests is enabled

    vapi_fn = <filename>
       specifies filename where to log into, if log_enabled is selected
*/

section VAPI
  enabled = 0
  server_port = 9998
  log_enabled = 0
  vapi_log_fn = "vapi.log"
end


/* CPU SECTION

   This section specifies various CPU parameters.

   ver = <value>
   rev = <value>
      specifies version and revision of the CPU used

   upr = <value>
      changes the upr register

   superscalar = 0/1
      whether CPU is scalar or superscalar
      (modify cpu/or32/execute.c to tune superscalar model)

   hazards = 0/1
      whether data hazards are tracked in superscalar CPU
      and displayed by the simulator r command

   dependstats = 0/1
      whether inter-instruction dependencies are calculated
      and displayed by simulator stats command.

   slp = 0/1
      calculation of subroutine level parallelism. Displayed
      by simulator stats command.

   btic = 0/1
      enable branch target instruction cache model

   bpb = 0/1
      enable branch prediction buffer model

      parameters for CPU analysis
*/

section cpu
  ver = 0x1200
  rev = 0x0001
  /* upr = */
  superscalar = 0
  hazards = 0
  dependstats = 0
  slp = 0
  btic = 0
  bpb = 0
end


/* DEBUG SECTION

   This sections specifies how debug unit should behave.

   enabled = 0/1
      whether debug unit is enabled

   gdb_enabled = 0/1
      whether to start gdb server at 'server_port' port

   server_port = <value>
      TCP/IP port to start gdb server on, used only if gdb_enabled
      is set

section debug
  enabled = 0
  gdb_enabled = 0
  server_port = 9999
end


/* MC SECTION

   This section configures the memory controller

   enabled = 0/1
      whether memory controller is enabled

   baseaddr = <hex_value>
      address of first MC register

   POC = <hex_value>
      Power On Configuration register
*/

section mc
  enabled = 1
  baseaddr = 0x93000000
  POC = 0x00000008                 /* Power on configuration register */
end


/* UART SECTION

   This section configures UARTs

   enabled = 0/1
      whether uarts are enabled

   nuarts = <value>
      make specified number of instances, configure each
      instance within device - enddevice construct.

   instance specific:
     baseaddr = <hex_value>
        address of first UART register for this device

     rx_file = "<filename>"
        filename, where to read data from

     tx_file = "<filename>"
        filename, where to write data to

     irq = <value>
        irq number for this device

     16550 = 0/1
        0, if this device is uart 16450 and 1, if it is 16550

     jitter = <value>
        in msecs... time to block, -1 to disable it

     vapi_id = <hex_value>
        VAPI id of this instance
*/

section uart
  enabled = 1
  nuarts = 1

  device 0
    baseaddr = 0x90000000
    irq = 2
    rxfile = "uart0.rx"
    txfile = "uart0.tx"
    jitter = -1                     /* async behaviour */
    16550 = 1
  enddevice
end


/* DMA SECTION

   This section configures DMAs

   enabled = 0/1
      whether DMAs are enabled

   ndmas = <value>
      make specified number of instances, configure each
      instance within device - enddevice construct.

   instance specific:
     baseaddr = <hex_value>
        address of first DMA register for this device

     irq = <value>
        irq number for this device

     vapi_id = <hex_value>
        VAPI id of this instance
*/

section dma
  enabled = 0
  ndmas = 1

  device 0
    baseaddr = 0x9a000000
    irq = 11
  enddevice
end


/* ETHERNET SECTION

   This section configures ethernets

   enabled = 0/1
      whether ethernets are enabled

   nethernets = <value>
      make specified number of instances, configure each
      instance within device - enddevice construct.

   instance specific:
     baseaddr = <hex_value>
        address of first ethernet register for this device

     dma = <value>
        which controller is this ethernet "connected" to

     rx_channel = <value>
        DMA channel used for RX

     tx_channel = <value>
        DMA channel used for TX

     rx_file = "<filename>"
        filename, where to read data from

     tx_file = "<filename>"
        filename, where to write data to

     vapi_id = <hex_value>
        VAPI id of this instance
*/

section ethernet
  nethernets = 1

  device 0
    baseaddr = 0x92000000
    dma = 0
    irq = 4
    rtx_type = 1
    tx_channel = 0
    rx_channel = 1
    rxfile = "eth0.rx"
    txfile = "eth0.tx"
    sockif = "eth0"
  enddevice
end

/* TICK TIMER SECTION

    This section configures tick timer

    enabled = 0/1
      whether tick timer is enabled

    irq = <value>
      irq number
*/

section tick
  enabled = 1
  irq = 0
end

section fb
  enabled = 1
  baseaddr = 0x97000000
  refresh_rate = 10000000
  filename = "primary"
end

/* KBD SECTION

    This section configures PS/2 compatible keyboard

    enabled = 0/1
      whether keyboard is enabled

    baseaddr = <hex_value>
      base address of the keyboard device

    rxfile = "<filename>"
      filename, where to read data from
*/

section kbd
  enabled = 1
  irq = 5
  baseaddr = 0x94000000
  rxfile = "kbd.rx"
end

